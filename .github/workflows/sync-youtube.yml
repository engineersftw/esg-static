name: Sync YouTube Channel

on:
  schedule:
    # Run daily at 2 AM UTC (10 AM SGT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install

      - name: Sync YouTube content
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cd packages/yt-export
          pnpm export --channel @engineerssg \
            --content ../../apps/website/content

      - name: Check for changes
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet apps/website/content; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "## YouTube Sync Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git diff --stat apps/website/content >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: sync YouTube content

            Updates videos and playlists from the YouTube Data API.

            Co-Authored-By: github-actions[bot] <noreply@anthropic.com>
          title: 'chore: sync YouTube content'
          body: |
            Automated sync of YouTube channel content.

            This PR updates the video and playlist entries from the YouTube Data API.

            ---
            _Generated by [GitHub Actions](https://github.com/features/actions)_
          branch: youtube-sync
          delete-branch: true
          labels: 'automated,youtube-sync'
          committer: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'

      - name: Send Telegram notification
        if: steps.changes.outputs.has_changes == 'true' && steps.pr.outputs.pull-request-url != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PR_URL="${{ steps.pr.outputs.pull-request-url }}"
          PR_NUMBER="${{ steps.pr.outputs.pull-request-number }}"

          MESSAGE="🎬 YouTube Sync Complete%0A%0A"
          MESSAGE="${MESSAGE}A new PR has been created with synced content.%0A%0A"
          MESSAGE="${MESSAGE}📱 PR: <a href='${PR_URL}'>PR #${PR_NUMBER}</a>%0A"
          MESSAGE="${MESSAGE}📊 <b>Repository:</b> ${{ github.repository }}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
