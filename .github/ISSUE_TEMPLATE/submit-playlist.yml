# Community playlist submissions. .github/workflows/playlist-submission.yml turns an issue made from
# this form into a pull request that adds the playlist and its videos (pnpm cms playlist submission).
# The field labels are what packages/cms/src/playlistSubmission.ts reads (PLAYLIST_FORM_FIELDS), so
# change both together. The Group options are the active organizations, like the video form's
# (pnpm cms organization create and pnpm cms form sync keep both in step). The categories are PLAYLIST_CATEGORIES in packages/cms/src/cms.ts (Conference
# Track is left out: tracks are nested under a conference by a maintainer).
name: Submit a playlist
description: Suggest a whole YouTube playlist, such as a conference or a meetup series
title: "Playlist submission: "
labels: ["playlist-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a playlist! Once you submit this form, a pull request adding the playlist and its public videos is created automatically, and a maintainer reviews it. The titles, descriptions and thumbnails come from YouTube, and the presenters are added during the review.
  - type: input
    id: url
    attributes:
      label: YouTube playlist URL
      description: The playlist must be public on YouTube. Its link has "list=" in it.
      placeholder: https://www.youtube.com/playlist?list=…
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What kind of playlist it is, if you know.
      options:
        - Conference
        - Meetup
        - Tutorial
        - Training
        - Shows
    validations:
      required: false
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: The meetup, conference or organization the playlist is from, if any. If it isn't listed, tell us under "Others (not in list)".
